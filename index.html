<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OT Tracker — Sign In</title>
  <link rel="manifest" href="manifest.json"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="OT Tracker"/>
  <link rel="apple-touch-icon" href="OTracker-logo.png"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    .auth-input {
      width: 100%;
      padding: .6rem .9rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: .88rem;
      margin-bottom: .75rem;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
      background: var(--card);
      color: var(--text);
    }
    .auth-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59,130,246,.12); }
    .auth-btn {
      width: 100%;
      padding: .7rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
      margin-top: .25rem;
    }
    .auth-btn:hover { background: var(--primary-dark); }
    .auth-btn:disabled { opacity: .55; cursor: not-allowed; }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .auth-label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: .3rem; color: var(--text); }
    .auth-footer-note { text-align: center; font-size: .75rem; color: var(--text-light); margin-top: 1rem; }
    .inline-error { font-size: .75rem; color: var(--danger); margin-top: -.4rem; margin-bottom: .5rem; font-weight: 500; }
  </style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <div class="logo">⏱</div>
      <h1>OT Tracker</h1>
      <p>Overtime &amp; Attendance Monitoring</p>
    </div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login">Sign In</button>
      <button class="auth-tab"        id="tab-signup">Create Account</button>
    </div>

    <div class="auth-body">

      <!-- Login Panel -->
      <div class="auth-panel active" id="panel-login">
        <div class="auth-error hidden" id="error-login"></div>
        <label class="auth-label">Email</label>
        <input class="auth-input" id="login-email" type="email" placeholder="you@email.com" autocomplete="email"/>
        <div class="inline-error" id="err-login-email" style="display:none"></div>
        <label class="auth-label">Password</label>
        <input class="auth-input" id="login-pass" type="password" placeholder="••••••••" autocomplete="current-password"/>
        <button class="auth-btn" id="btn-login">Sign In</button>
        <div style="text-align:center;margin-top:.75rem">
          <button id="btn-forgot-password" style="background:none;border:none;color:var(--primary);font-size:.8rem;cursor:pointer;font-family:inherit;text-decoration:underline">
            Forgot password?
          </button>
        </div>
        <p class="auth-footer-note">Philippines Standard Time (UTC+8)</p>
      </div>

      <!-- Sign Up Panel -->
      <div class="auth-panel" id="panel-signup">
        <div class="auth-error hidden" id="error-signup"></div>
        <label class="auth-label">Full Name</label>
        <input class="auth-input" id="signup-name" type="text" placeholder="Juan dela Cruz" autocomplete="name"/>
        <label class="auth-label">Email</label>
        <input class="auth-input" id="signup-email" type="email" placeholder="you@email.com" autocomplete="email"/>
        <div class="inline-error" id="err-signup-email" style="display:none"></div>
        <label class="auth-label">Password</label>
        <input class="auth-input" id="signup-pass" type="password" placeholder="Min. 8 characters" autocomplete="new-password"/>
        <div class="inline-error" id="err-pass1" style="display:none"></div>
        <label class="auth-label">Confirm Password</label>
        <input class="auth-input" id="signup-pass2" type="password" placeholder="Repeat password" autocomplete="new-password"/>
        <div class="inline-error" id="err-pass2" style="display:none"></div>
        <button class="auth-btn" id="btn-signup">Create Account</button>
      </div>

    </div>
  </div>
</div>

<!-- Forgot Password Modal -->
<div id="forgot-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;align-items:center;justify-content:center;padding:1rem">
  <div style="background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:380px;padding:1.75rem;animation:slideUp .2s ease">
    <div style="font-size:1rem;font-weight:700;margin-bottom:.4rem">Reset Password</div>
    <p style="font-size:.83rem;color:#64748B;margin-bottom:1rem">Enter your email address and we'll send you a link to reset your password.</p>
    <div id="forgot-success" style="display:none;background:#ECFDF5;color:#065F46;border-radius:7px;padding:.65rem .9rem;font-size:.82rem;margin-bottom:1rem;font-weight:500">
      ✅ Reset link sent! Check your email inbox (and spam folder).
    </div>
    <div id="forgot-error" style="display:none;background:#FEF2F2;color:#EF4444;border-radius:7px;padding:.65rem .9rem;font-size:.82rem;margin-bottom:1rem;font-weight:500"></div>
    <label style="display:block;font-size:.8rem;font-weight:600;margin-bottom:.3rem">Email</label>
    <input id="forgot-email" type="email" placeholder="you@email.com" autocomplete="email"
      style="width:100%;padding:.6rem .9rem;border:1px solid #E2E8F0;border-radius:8px;font-family:inherit;font-size:.88rem;margin-bottom:.85rem;outline:none;box-sizing:border-box"/>
    <div style="display:flex;gap:.5rem;justify-content:flex-end">
      <button id="btn-forgot-cancel" style="padding:.55rem 1rem;border-radius:7px;border:1px solid #E2E8F0;background:none;cursor:pointer;font-family:inherit;font-size:.83rem;color:#64748B">Cancel</button>
      <button id="btn-forgot-send" style="padding:.55rem 1.1rem;border-radius:7px;border:none;background:#3B82F6;color:#fff;cursor:pointer;font-family:inherit;font-size:.83rem;font-weight:600">Send Reset Link</button>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>if ('serviceWorker' in navigator) navigator.serviceWorker.register('/service-worker.js');</script>
</body>
</html>
